  .vcard:hover, .vcard:focus-within { border-color: var(--red); }

  .yt:hover img, .yt:focus-visible img { opacity: 1; transform: scale(1.03); }
  .yt:focus-visible { outline: 2px solid var(--teal); outline-offset: -2px; }
  .play { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; display: grid; place-items: center; color: #fff; background: rgba(255,26,46,.88); box-shadow: 0 0 24px var(--red-glow);

  .yt:hover .play { transform: scale(1.08); }
  .vcard figcaption { padding: 12px 14px 14px; font-size: 14px; font-weight: 700; line-height: 1.5; color: #fff; }
  .group .lead { margin-top: -2px; }
  .btn-yt { --c: #ff3355; } .btn-x { --c: #e7e9ea; }

<script>
  // サムネイルをタップしたときだけYouTubeを読み込む（最初の表示を軽くするため）
  document.querySelectorAll('.yt').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var f = document.createElement('iframe');
      f.src = 'https://www.youtube-nocookie.com/embed/' + btn.dataset.id + '?autoplay=1&rel=0';
      f.title = btn.getAttribute('aria-label').replace(/ を再生$/, '');
      f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      f.allowFullscreen = true;
      btn.replaceWith(f);
      f.focus();
    });
  });
